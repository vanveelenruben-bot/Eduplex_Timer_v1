<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Eduplex Exam Timer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --navy: #1B3A6B;
    --navy-deep: #10233F;
    --green: #1B5E3A;
    --green-bright: #2F8F5B;
    --cream: #F7F6F2;
    --ink: #12203A;
    --muted: #8A90A0;
    --hairline: rgba(18,32,58,0.12);
    --amber: #B8791A;
    --red: #A83A32;
    --ring-track: rgba(18,32,58,0.07);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; min-height:100%;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- header ---------- */
  header{
    width:100%;
    max-width:440px;
    padding: 30px 24px 18px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  header img{
    width:34px; height:34px; flex-shrink:0; display:block;
  }
  header .brand-text{ line-height:1.2; }
  header .brand-text .name{
    font-family:'Fraunces', serif;
    font-size:1rem;
    font-weight:600;
    color: var(--navy-deep);
  }
  header .brand-text .motto{
    font-size:0.68rem;
    color: var(--muted);
    font-style: italic;
    font-family:'Fraunces', serif;
  }

  /* ---------- main ---------- */
  main{
    width:100%;
    max-width:440px;
    flex:1;
    padding: 4px 24px 36px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:30px;
  }

  .exam-label-wrap{ width:100%; }
  .exam-label-wrap input{
    width:100%;
    border:none;
    background:transparent;
    text-align:center;
    font-family:'Fraunces', serif;
    font-size:1.05rem;
    font-weight:500;
    color: var(--ink);
    padding: 4px 4px 8px;
    outline:none;
  }
  .exam-label-wrap input::placeholder{ color:#A6ABB6; font-weight:400; }

  /* ---------- timer ring ---------- */
  .timer-stage{
    position:relative;
    width:min(72vw, 280px);
    height:min(72vw, 280px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .timer-stage .logo-blur{
    position:absolute;
    inset:6px;
    border-radius:50%;
    overflow:hidden;
    pointer-events:none;
  }
  .timer-stage .logo-blur img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter: blur(14px) saturate(1.05);
    transform: scale(1.25);
    opacity:0.55;
  }
  .timer-stage .logo-blur::after{
    content:'';
    position:absolute;
    inset:0;
    background: radial-gradient(circle, rgba(247,246,242,0.15) 0%, rgba(247,246,242,0.55) 100%);
  }
  .timer-stage svg{ position:absolute; inset:0; width:100%; height:100%; transform: rotate(-90deg); }
  .ring-track{ fill:none; stroke: var(--ring-track); stroke-width:6; }
  .ring-progress{
    fill:none;
    stroke: var(--green-bright);
    stroke-width:6;
    stroke-linecap:round;
    transition: stroke-dashoffset 0.4s linear, stroke 0.5s ease;
  }

  .time-readout{
    position:relative;
    text-align:center;
    font-family:'Fraunces', serif;
    font-variant-numeric: tabular-nums;
    font-size: clamp(2.4rem, 12vw, 3.2rem);
    font-weight:500;
    color: var(--navy-deep);
    letter-spacing: 0.01em;
  }
  .time-readout .state{
    display:block;
    font-family:'Inter', sans-serif;
    font-size:0.68rem;
    font-weight:600;
    color: var(--muted);
    letter-spacing:0.06em;
    margin-top:6px;
  }
  .time-readout.warning{ color: var(--amber); }
  .time-readout.warning .state{ color: var(--amber); }
  .time-readout.critical{ color: var(--red); }
  .time-readout.critical .state{ color: var(--red); }

  @keyframes pulse{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.03); }
  }
  .timer-stage.done .ring-progress{ stroke: var(--red); }
  .timer-stage.done .time-readout{ animation: pulse 1.1s ease-in-out infinite; }

  /* ---------- settings ---------- */
  .settings{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .setting-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .setting-row .setting-label{
    font-size:0.85rem;
    font-weight:500;
    color: var(--ink);
  }
  .setting-row .setting-sub{
    display:block;
    font-size:0.72rem;
    font-weight:400;
    color: var(--muted);
    margin-top:1px;
  }

  .switch{
    position:relative;
    width:38px; height:22px;
    flex-shrink:0;
  }
  .switch input{ opacity:0; width:0; height:0; }
  .switch .track{
    position:absolute; inset:0;
    background: var(--hairline);
    border-radius:100px;
    cursor:pointer;
    transition: background 0.2s ease;
  }
  .switch .track::before{
    content:'';
    position:absolute;
    width:16px; height:16px;
    left:3px; top:3px;
    background:#fff;
    border-radius:50%;
    box-shadow:0 1px 2px rgba(0,0,0,0.25);
    transition: transform 0.2s ease;
  }
  .switch input:checked + .track{ background: var(--green); }
  .switch input:checked + .track::before{ transform: translateX(16px); }

  .minutes-input{
    width:52px;
    text-align:center;
    border:none;
    border-bottom:1.5px solid var(--hairline);
    background:transparent;
    padding:4px 2px;
    font-family:'Inter', sans-serif;
    font-size:0.9rem;
    font-weight:500;
    color: var(--ink);
    outline:none;
  }
  .minutes-input:focus{ border-bottom-color: var(--navy); }
  .minutes-input:disabled{ color:#C3C7CF; border-bottom-color: var(--hairline); }

  .presets{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .preset-btn{
    border:1px solid var(--hairline);
    background:transparent;
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-size:0.8rem;
    font-weight:500;
    padding:7px 13px;
    border-radius:100px;
    cursor:pointer;
    transition: all 0.15s ease;
  }
  .preset-btn:hover{ border-color: var(--navy); }
  .preset-btn.active{
    background: var(--navy);
    border-color: var(--navy);
    color:#fff;
  }

  hr.div{
    width:100%;
    border:none;
    border-top:1px solid var(--hairline);
    margin:0;
  }

  /* ---------- controls ---------- */
  .controls{
    display:flex;
    gap:10px;
    width:100%;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:10px;
    padding:14px 10px;
    font-family:'Inter', sans-serif;
    font-size:0.92rem;
    font-weight:600;
    cursor:pointer;
    transition: transform 0.08s ease, opacity 0.15s ease, background 0.15s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--navy); color:#fff; }
  .btn-primary:hover{ background: var(--navy-deep); }
  .btn-secondary{ background:transparent; color: var(--ink); border:1px solid var(--hairline); }
  .btn-secondary:hover{ border-color: var(--navy); }

  .utility-row{
    display:flex;
    justify-content:center;
    gap:20px;
  }
  .utility-link{
    background:none; border:none;
    font-family:'Inter', sans-serif;
    font-size:0.75rem;
    color: var(--muted);
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
  }
  .utility-link:hover{ color: var(--navy); }
  .utility-link.hidden{ display:none; }

  .focus-btn{
    background: var(--navy);
    color:#fff;
    border:none;
    text-decoration:none;
    border-radius:100px;
    padding:8px 18px;
    font-weight:600;
    font-size:0.78rem;
    letter-spacing:0.01em;
    box-shadow:0 2px 6px rgba(27,58,107,0.28);
    transition: background 0.15s ease, transform 0.08s ease, box-shadow 0.15s ease;
  }
  .focus-btn:hover{ background: var(--navy-deep); box-shadow:0 3px 10px rgba(27,58,107,0.34); }
  .focus-btn:active{ transform: scale(0.96); }

  footer{
    padding:16px 24px 26px;
    font-size:0.7rem;
    color: var(--muted);
    text-align:center;
    max-width:440px;
  }

  /* ---------- focus mode ---------- */
  body.focus-mode .exam-label-wrap,
  body.focus-mode .settings,
  body.focus-mode hr.div,
  body.focus-mode footer{
    display:none;
  }
  /* Corner logo: pinned to the corner instead of disappearing with the rest of the header */
  body.focus-mode header{
    position:fixed;
    top:16px; left:16px;
    padding:0;
    margin:0;
    max-width:none;
    width:auto;
    gap:0;
    z-index:30;
    pointer-events:none;
  }
  body.focus-mode header .brand-text{ display:none; }
  body.focus-mode header img{
    width:30px; height:30px;
    opacity:0.55;
  }
  body.focus-mode main{ justify-content:center; flex:1; gap:36px; }
  body.focus-mode .timer-stage{ width:min(66vw, 420px); height:min(66vw, 420px); }
  body.focus-mode .exam-title-display{
    display:block;
    font-family:'Fraunces', serif;
    font-size:1.05rem;
    color: var(--navy-deep);
    text-align:center;
  }
  .exam-title-display{ display:none; }

  @media (prefers-reduced-motion: reduce){
    .timer-stage.done .time-readout{ animation:none; }
    .ring-progress{ transition:none; }
  }

  /* ---------- desktop ---------- */
  @media (min-width: 900px){
    body{
      justify-content:center;
      background: radial-gradient(circle at 50% 0%, #FDFCFA 0%, var(--cream) 55%);
    }
    header{ padding-top:40px; }
    main{
      max-width:480px;
      background:#fff;
      border-radius:22px;
      padding:36px 44px 44px;
      box-shadow:0 24px 60px rgba(18,32,58,0.10), 0 4px 14px rgba(18,32,58,0.06);
      margin-bottom:40px;
    }
    .timer-stage{
      width:min(28vw, 320px);
      height:min(28vw, 320px);
    }
    .time-readout{
      font-size: clamp(2.8rem, 4.5vw, 3.6rem);
    }
    .btn:hover{ opacity:0.92; }
    .preset-btn, .btn, .focus-btn, .utility-link{ cursor:pointer; }

    body.focus-mode main{
      background:none;
      box-shadow:none;
      padding:0;
      margin-bottom:0;
    }
    body.focus-mode .timer-stage{
      width:min(26vw, 460px);
      height:min(26vw, 460px);
    }
  }
</style>
</head>

    <svg viewBox="0 0 200 200">
      <circle class="ring-track" cx="100" cy="100" r="90"></circle>
      <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="90"></circle>
    </svg>
    <div class="time-readout" id="timeReadout">
      45:00
      <span class="state" id="stateLabel">READY</span>
    </div>
  </div>

  <div class="settings">
    <div class="setting-row">
      <div>
        <span class="setting-label">Reading time</span>
        <span class="setting-sub">Silent reading before writing starts</span>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <input class="minutes-input" id="readingMinutes" type="number" min="0" max="60" value="10">
        <label class="switch">
          <input type="checkbox" id="readingToggle" checked>
          <span class="track"></span>
        </label>
      </div>
    </div>

    <hr class="div">

    <div class="setting-row">
      <div>
        <span class="setting-label">Exam duration</span>

      <button class="preset-btn" data-min="30">30</button>

  </div>

<footer>Reading time counts down first in green, then hands off to exam time in blue. Focus mode hides setup controls for projecting during the exam.</footer>

<script>
(function(){
  const RADIUS = 90;
  const CIRC = 2 * Math.PI * RADIUS;

  const ring = document.getElementById('ringProgress');
  ring.style.strokeDasharray = CIRC.toFixed(2);
  ring.style.strokeDashoffset = '0';

  const readout = document.getElementById('timeReadout');
  const stateLabel = document.getElementById('stateLabel');
  const stage = document.getElementById('timerStage');
  const startPauseBtn = document.getElementById('startPauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const presetsWrap = document.getElementById('presets');
  const customInput = document.getElementById('customMinutes');
  const examLabel = document.getElementById('examLabel');
  const examTitleDisplay = document.getElementById('examTitleDisplay');
  const focusToggle = document.getElementById('focusToggle');
  const soundToggle = document.getElementById('soundToggle');
  const readingToggle = document.getElementById('readingToggle');
  const readingMinutesInput = document.getElementById('readingMinutes');
  const skipReadingBtn = document.getElementById('skipReading');

  let examMinutes = 45;
  let readingMinutes = 10;
  let readingEnabled = true;

  let phase = 'idle'; // idle -> reading -> exam -> done
  let phaseTotal = 0;
  let remaining = 0;
  let running = false;
  let intervalId = null;
  let soundOn = true;
  let audioCtx = null;

  function fmt(sec){
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function ringColorFor(){
    if(phase === 'reading') return getComputedStyle(document.documentElement).getPropertyValue('--green-bright');
    return getComputedStyle(document.documentElement).getPropertyValue('--navy');
  }

  function initIdleDisplay(){
    phase = 'idle';
    phaseTotal = examMinutes * 60;
    remaining = readingEnabled ? readingMinutes * 60 : examMinutes * 60;
    ring.style.stroke = ringColorFor();
  }

  function render(){
    readout.childNodes[0].nodeValue = fmt(remaining) + ' ';
    const frac = phaseTotal > 0 ? remaining / phaseTotal : 0;
    ring.style.strokeDashoffset = (CIRC * (1 - frac)).toFixed(2);
    ring.style.stroke = phase === 'reading' ? getComputedStyle(document.documentElement).getPropertyValue('--green-bright') : getComputedStyle(document.documentElement).getPropertyValue('--navy');

    readout.classList.remove('warning','critical');
    stage.classList.remove('done');
    skipReadingBtn.classList.toggle('hidden', phase !== 'reading');

    if(phase === 'done'){
      stateLabel.textContent = "TIME'S UP";
      stage.classList.add('done');
    } else if(phase === 'reading'){
      stateLabel.textContent = running ? 'READING TIME' : (remaining === phaseTotal ? 'READING TIME \u2014 READY' : 'READING TIME \u2014 PAUSED');
    } else if(phase === 'exam'){
      if(remaining <= 60){
        readout.classList.add('critical');
        stateLabel.textContent = 'FINAL MINUTE';
      } else if(remaining <= 300){
        readout.classList.add('warning');
        stateLabel.textContent = '5 MINUTES LEFT';
      } else {
        stateLabel.textContent = running ? 'EXAM TIME' : 'EXAM TIME \u2014 PAUSED';
      }
    } else {
      stateLabel.textContent = readingEnabled ? 'READING TIME \u2014 READY' : 'READY';
    }
  }

  function beep(pattern){
    if(!soundOn) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const t0 = audioCtx.currentTime;
      pattern.forEach(function(freq, i){
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t0 + i*0.4);
        gain.gain.exponentialRampToValueAtTime(0.3, t0 + i*0.4 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + i*0.4 + 0.3);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0 + i*0.4);
        osc.stop(t0 + i*0.4 + 0.35);
      });
    }catch(e){}
  }

  function beginExamPhase(){
    phase = 'exam';
    phaseTotal = examMinutes * 60;
    remaining = phaseTotal;
    beep([660, 880]);
    render();
  }

  function tick(){
    remaining -= 1;
    if(remaining <= 0){
      remaining = 0;
      if(phase === 'reading'){
        render();
        beginExamPhase();
        return;
      }
      render();
      stop();
      beep([880, 880, 880]);
      phase = 'done';
      render();
      return;
    }
    render();
  }

  function start(){
    if(running) return;
    if(phase === 'idle'){
      phase = readingEnabled ? 'reading' : 'exam';
      phaseTotal = phase === 'reading' ? readingMinutes * 60 : examMinutes * 60;
      remaining = phaseTotal;
    }
    if(phase === 'done') return;
    running = true;
    startPauseBtn.textContent = 'Pause';
    intervalId = setInterval(tick, 1000);
    render();
  }

  function stop(){
    running = false;
    startPauseBtn.textContent = 'Start';
    clearInterval(intervalId);
    render();
  }

  function reset(){
    clearInterval(intervalId);
    running = false;
    startPauseBtn.textContent = 'Start';
    initIdleDisplay();
    render();
  }

  function updateExamMinutes(min){
    examMinutes = min;
    if(phase === 'idle' || phase === 'done'){
      reset();
    }
  }

  startPauseBtn.addEventListener('click', function(){
    if(running) stop(); else start();
  });

  resetBtn.addEventListener('click', reset);

  skipReadingBtn.addEventListener('click', function(){
    if(phase !== 'reading') return;
    beginExamPhase();
  });

  presetsWrap.addEventListener('click', function(e){
    const btn = e.target.closest('.preset-btn');
    if(!btn) return;
    [...presetsWrap.children].forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    customInput.value = '';
    updateExamMinutes(parseInt(btn.dataset.min, 10));
  });

  customInput.addEventListener('change', function(){
    const val = parseInt(customInput.value, 10);
    if(!val || val < 1) return;
    [...presetsWrap.children].forEach(b => b.classList.remove('active'));
    updateExamMinutes(val);
  });

  readingToggle.addEventListener('change', function(){
    readingEnabled = readingToggle.checked;
    readingMinutesInput.disabled = !readingEnabled;
    if(phase === 'idle' || phase === 'done'){
      reset();
    }
  });

  readingMinutesInput.addEventListener('change', function(){
    const val = parseInt(readingMinutesInput.value, 10);
    if(val < 0) return;
    readingMinutes = val || 0;
    if(phase === 'idle' || phase === 'done'){
      reset();
    }
  });

  examLabel.addEventListener('input', function(){
    examTitleDisplay.textContent = examLabel.value || 'Exam Timer';
  });

  focusToggle.addEventListener('click', function(){
    document.body.classList.toggle('focus-mode');
    examTitleDisplay.textContent = examLabel.value || 'Exam Timer';
    const entering = document.body.classList.contains('focus-mode');
    focusToggle.textContent = entering ? 'Exit focus mode' : 'Focus mode';
    if(entering && document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else if(!entering && document.exitFullscreen && document.fullscreenElement){
      document.exitFullscreen().catch(()=>{});
    }
  });

  soundToggle.addEventListener('click', function(){
    soundOn = !soundOn;
    soundToggle.textContent = 'Sound: ' + (soundOn ? 'on' : 'off');
  });

  document.addEventListener('keydown', function(e){
    if(e.code === 'Space' && document.activeElement.tagName !== 'INPUT'){
      e.preventDefault();
      if(running) stop(); else start();
    }
  });

  initIdleDisplay();
  render();
})();
</script>

</body>
</html>
